<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>লোকসুর — বাংলার নতুন লোকগীতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3EEE0;
    --cream-2:#EAE2CC;
    --indigo:#1E2A45;
    --indigo-2:#2B3B5C;
    --mustard:#D9A441;
    --rust:#B5482A;
    --paddy:#3C6255;
    --paper-line: rgba(30,42,69,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--cream);
    background-image:
      radial-gradient(circle at 10% 8%, rgba(181,72,42,0.05) 0, transparent 40%),
      radial-gradient(circle at 90% 92%, rgba(60,98,85,0.06) 0, transparent 40%);
    font-family:'Hind Siliguri', sans-serif;
    color: var(--indigo);
    overflow:hidden;
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  .display{font-family:'Baloo Da 2', sans-serif;}

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    padding: 14px 16px 10px;
    background: var(--indigo);
    color: var(--cream);
    position:relative;
    z-index:5;
    box-shadow: 0 4px 14px rgba(30,42,69,0.18);
  }
  .brand-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:34px; height:34px; flex:0 0 auto;
  }
  .brand h1{
    font-size:19px; margin:0; font-weight:700; letter-spacing:.2px;
  }
  .brand p{
    margin:1px 0 0; font-size:11px; opacity:.75; font-weight:500;
  }
  .search-toggle{
    width:36px;height:36px;border-radius:50%;
    background: rgba(243,238,224,0.12);
    border:1px solid rgba(243,238,224,0.25);
    display:flex;align-items:center;justify-content:center;
    color: var(--cream); cursor:pointer;
  }
  .search-wrap{
    max-height:0; overflow:hidden; transition: max-height .28s ease;
  }
  .search-wrap.open{ max-height:50px; margin-top:10px;}
  .search-wrap input{
    width:100%; border:none; outline:none; border-radius:20px;
    padding:9px 16px; font-family:'Hind Siliguri',sans-serif; font-size:14px;
    background: var(--cream); color: var(--indigo);
  }
  .chips{
    display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:6px 14px; border-radius:16px;
    font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer;
    border:1px solid rgba(243,238,224,0.3); color: rgba(243,238,224,0.85);
    background: transparent; transition: all .15s ease;
  }
  .chip.active{
    background: var(--mustard); color: var(--indigo); border-color: var(--mustard);
  }

  /* ---------- Stitch divider (signature motif) ---------- */
  .stitch{
    height:10px; width:100%;
    background-image: repeating-linear-gradient(90deg, var(--mustard) 0 8px, transparent 8px 16px);
    opacity:.55;
  }

  /* ---------- Carousel ---------- */
  .stage{
    flex:1 1 auto;
    position:relative;
    overflow:hidden;
  }
  .track{
    display:flex;
    height:100%;
    transition: transform .38s cubic-bezier(.22,.68,.35,1);
    will-change: transform;
  }
  .card-slot{
    flex:0 0 100%;
    height:100%;
    padding: 16px 16px 8px;
    display:flex;
  }
  .card{
    flex:1;
    background: var(--cream);
    border-radius:22px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border: 2px solid rgba(30,42,69,0.08);
    box-shadow: 0 10px 30px rgba(30,42,69,0.12);
  }
  .kantha-border{
    position:absolute; inset:8px;
    border-radius:16px;
    border: 2px dashed rgba(181,72,42,0.35);
    pointer-events:none;
  }
  .card-top{
    padding: 22px 22px 10px;
    text-align:center;
    position:relative;
  }
  .genre-tag{
    display:inline-block;
    font-size:11.5px; font-weight:700; letter-spacing:.3px;
    color: var(--cream);
    background: var(--rust);
    padding:4px 12px; border-radius:12px;
    margin-bottom:10px;
  }
  .card-title{
    font-size:26px; font-weight:700; margin:0 0 4px; color: var(--indigo);
    line-height:1.25;
  }
  .card-index{
    font-size:12px; color: rgba(30,42,69,0.5); font-weight:600;
  }
  .lotus{
    width:60px; height:14px; margin:10px auto 0; opacity:.6;
  }
  .lyrics-scroll{
    flex:1;
    overflow-y:auto;
    padding: 6px 26px 26px;
    -webkit-overflow-scrolling: touch;
  }
  .stanza{
    font-size:16.5px;
    line-height:2;
    color: var(--indigo-2);
    white-space:pre-line;
    text-align:center;
    margin: 0 0 20px;
    padding-bottom:18px;
    border-bottom: 1px dashed rgba(30,42,69,0.12);
    font-weight:500;
  }
  .stanza:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0;}

  /* ---------- Footer controls ---------- */
  footer{
    flex:0 0 auto;
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--indigo);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    z-index:5;
  }
  .nav-btn{
    width:44px; height:44px; border-radius:50%;
    background: rgba(243,238,224,0.1);
    border: 1px solid rgba(243,238,224,0.22);
    color: var(--cream);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex:0 0 auto;
    transition: background .15s ease;
  }
  .nav-btn:active{ background: var(--mustard); color: var(--indigo);}
  .dots{
    flex:1; display:flex; justify-content:center; align-items:center; gap:5px;
    overflow:hidden;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background: rgba(243,238,224,0.3);
    transition: all .2s ease;
    flex:0 0 auto;
  }
  .dot.active{
    background: var(--mustard);
    width:18px; border-radius:4px;
  }
  .counter{
    color: var(--cream); font-size:12px; font-weight:600; opacity:.8;
    min-width:44px; text-align:center;
  }

  .copy-btn{
    position:absolute; top:18px; right:18px;
    width:38px; height:38px; border-radius:50%;
    background: rgba(30,42,69,0.06);
    border: 1px solid rgba(30,42,69,0.12);
    display:flex; align-items:center; justify-content:center;
    color: var(--indigo); cursor:pointer; z-index:2;
    transition: background .15s ease, transform .15s ease;
  }
  .copy-btn:active{ transform: scale(0.92); background: var(--mustard); border-color: var(--mustard); color:var(--indigo);}
  .copy-btn.copied{ background: var(--paddy); border-color: var(--paddy); color: var(--cream);}
  .toast{
    position:fixed; left:50%; bottom:86px; transform: translateX(-50%) translateY(20px);
    background: var(--indigo); color: var(--cream);
    padding:10px 20px; border-radius:20px; font-size:13.5px; font-weight:600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition: all .25s ease;
    z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .empty-state{
    display:flex; align-items:center; justify-content:center; height:100%;
    flex-direction:column; gap:10px; color: rgba(30,42,69,0.55); padding:40px;
    text-align:center;
  }

  @media (min-width:600px){
    .card-slot{ padding:24px 20% 12px; }
    .card-title{ font-size:30px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" stroke="#D9A441" stroke-width="1.5" stroke-dasharray="3 3"/>
        <path d="M20 8 C13 14, 13 26, 20 32 C27 26, 27 14, 20 8Z" fill="#B5482A" opacity="0.85"/>
        <path d="M20 13 C16 17, 16 24, 20 28" stroke="#F3EEE0" stroke-width="1.2" fill="none"/>
      </svg>
      <div>
        <h1 class="display">লোকসুর</h1>

      </div>
    </div>
    <div class="search-toggle" id="searchToggle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

  <div class="chips" id="chips"></div>
</header>
<div class="stitch"></div>

<div class="stage">
  <div class="track" id="track"></div>
</div>
<div class="toast" id="toast">কপি হয়েছে ✓</div>

<footer>
  <div class="nav-btn" id="prevBtn">

  </div>
  <div class="counter" id="counter">1 / 50</div>
  <div class="dots" id="dots"></div>
  <div class="nav-btn" id="nextBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</footer>

জ সরল,\nবুকের মাঝে অনেক টান,\nতাদের সুরে বাজে যেন,\nএই মাটিরই আসল প্রাণ।"]}, {"id": 24, "genre": "মুর্শিদি", "title": "মুর্শিদ আমার", "stanzas": ["মুর্শিদ আমার পথ দেখাও,\nআঁধার ঘরে জ্বালাও বাতি,\nতোমার চরণ ছাড়া প্রভু,\nআর কারো নাই আমার সাথি।", "দুনিয়াদারির মায়া কাটাও,\nসহজ পথে নিয়ে চল,\nতোমার ইশারায় বাঁচি মরি,\nতুমি হও গো আমার বল।"]}, {"id": 25, "genre": "মুর্শিদি", "title": "পীরের দরবার", "stanzas": ["পীরের দরবারে সেজদা করি,\nমন খুলে দিই সকল কথা,\nদুনিয়ার এই ভিড়ের মাঝে,\nতুমি জানো আমার ব্যথা।", "গুনাহগার এই বান্দা আমি,\nক্ষমা করো দয়া করে,\nতোমার রহম বিনা প্রভু,\nকে বাঁচাবে এই সংসারে।"]}, {"id": 26, "genre": "মুর্শিদি", "title": "এক নূরে সব", "stanzas": ["এক নূরে সব সৃষ্টি হলো,\nমাটি জল আকাশ বাতাস,\nসেই নূরেরই জ্যোতি খোঁজে,\nবান্দার এই মনের আশ।", "যে চিনেছে নিজের ভেতর,\nসেই চিনেছে রবের পরিচয়,\nমুর্শিদ বলে শোন রে বান্দা,\nএই কথাতেই আসল জয়।"]}, {"id": 27, "genre": "মুর্শিদি", "title": "খাঁটি বান্দা", "stanzas": ["খাঁটি বান্দা হইতে গেলে,\nছাড়তে হবে অহংকার,\nনিজেরে ভুলে রবকে চেনা,\nএই তো পথের মূল আধার।", "দুনিয়া মায়া ছলনা করে,\nক্ষণিক সুখের ছবি দেখায়,\nআখেরাতের পথিক হয়ে,\nচল রে মন সঠিক খাতায়।"]}, {"id": 28, "genre": "মুর্শিদি", "title": "রুহুর কথা", "stanzas": ["রুহুর কথা কে শোনে আর,\nদেহের মায়ায় ডুবে সবাই,\nএকদিন এই দেহ ছাড়বে,\nরুহু চলবে একলা তবই।", "প্রস্তুতি নে রে বান্দা তুই,\nসেই দিনের এই সফরে,\nমুর্শিদের হাত ধরে থাকিস,\nপার হবি রে ভয়ের চরে।"]}, {"id": 29, "genre": "জারি", "title": "কারবালার কথা", "stanzas": ["কারবালার ময়দানে সেদিন,\nকী হয়েছিল কে জানে ভাই,\nসত্যের পথে জীবন দিলেন,\nহোসেন ছিলেন নবীর জামাই।", "তৃষ্ণা বুকে ফোরাত নদী,\nকাছে থেকেও পানি না পেল,\nসেই কাহিনী মন কাঁদায়,\nআজও যে চোখ ভিজিয়ে গেল।"]}, {"id": 30, "genre": "জারি", "title": "শহীদের স্মরণে", "stanzas": ["শহীদ যারা রক্ত দিলেন,\nসত্য পথের মশাল হাতে,\nতাদের কথা মনে রেখে,\nজারি গাই আমরা রাতে।", "ন্যায়ের পথে যে জন লড়ে,\nইতিহাসে থাকে তার নাম,\nসেই আদর্শে বাঁচার চেষ্টা,\nএই তো জারির আসল কাম।"]}, {"id": 31, "genre": "সারি", "title": "নৌকা বাইচের গান", "stanzas": ["হেইও হেইও বৈঠা মার করে শুধু ভ্রমণ।"]}, {"id": 54, "genre": "দেহতত্ত্ব", "title": "মাটির প্রদীপ", "stanzas": ["মাটির প্রদীপ জ্বলছে দেহে,\nতেল ফুরালে নিভে যাবে,\nযতক্ষণ এই আলো আছে,\nসত্য পথে চল রে ভাবে।", "নিভে গেলে এই প্রদীপ,\nআঁধার নামবে চিরতরে,\nআলো থাকতে চিনে নে রে,\nকে আছে এই দেহঘরে।"]}, {"id": 55, "genre": "দেহতত্ত্ব", "title": "অধরার ঠিকানা", "stanzas": ["অধরারে ধরতে গেলে,\nহাত পাতে না সে ধরায়,\nমনের চোখে দেখতে হয়,\nবাহিরের চোখ যে ফিরায়।", "যে চেনে সে বলে না কিছু,\nচুপ করে সে হাসে শুধু,\nনা বলা সেই কথার মাঝে,\nলুকিয়ে থাকে আসল মধু।"]}, {"id": 56, "genre": "বিচ্ছেদী গান", "title": "বন্ধু গেলে ছাড়ি", "stanzas": ["বন্ধু আমার গেলে ছাড়ি,\nকবে তুমি আসবে ফিরে,\nএকলা রাতের প্রহর গোনা,\nদিন কাটে না চোখের নীরে।", "চাঁদ উঠেছে আকাশ জুড়ে,\nতোমার মুখে ভাসে সেই আলো,\nদূরের পথে চেয়ে থাকি,\nআসবে কবে বলো না বলো।"]}, {"id": 57, "genre": "বিচ্ছেদী গান", "title": "পরান পাখি উড়ে গেল", "stanzas": ["পরান পাখি উড়ে গেল,\nখাঁচা পড়ে রইল একা,\nযে পাখি ছিল প্রাণের সাথি,\nআর হলো না তাহার দেখা।", "খাঁচার মায়া কেটে গেলে,\nআর কি ফেরে হারানো পাখি,\nচোখের জলে ভিজে বুক,\nদিন কাটে যে ডাকাডাকি।"]}, {"id": 58, "genre": "বিচ্ছেদী গান", "title": "দুই কূলের কান্না", "stanzas": ["এক কূলেতে আমি একা,\nঅন্য কূলে তুমি বন্ধু,\nমাঝে বহে বিচ্ছেদ নদী,\nমিলন যেন সুদূর সিন্ধু।", "পার হতে চাই নাই যে নৌকা,\nডাক দিতে গলা ভাঙে,\nবিচ্ছেদেরই এই যে গান,\nরচে গেল বুকের রাঙে।"]}, {"id": 59, "genre": "বিচ্ছেদী গান", "title": "চিঠি লিখি চোখের জলে", "stanzas": ["চিঠি লিখি চোখের জলে,\nঠিকানা তার জানি না ভাই,\nকোথায় পাঠাই কেমনে পাঠাই,\nবন্ধু আমার কোথায় তা নাই।", "হাওয়ার কাছে ভার সঁপে দিই,\nউড়িয়ে দিলাম মনের কথা,\nযদি কভু পৌঁছে যায়,\nজানুক আমার এই ব্যথা।"]}, {"id": 60, "genre": "বিচ্ছেদী গান", "title": "শূন্য ঘরের বাতি", "stanzas": ["শূন্য ঘরে জ্বালাই বাতি,\nতুমি ছাড়া কে দেখে তায়,\nএকলা ছায়া দেয়াল জুড়ে,\nনিজের সাথেই কথা কয়।", "রাত্রি গভীর, ঘুম আসে না,\nতোমার স্মৃতি জাগে চোখে,\nবিচ্ছেদের এই দীর্ঘ প্রহর,\nকেমনে কাটাই বলো লোকে।"]}, {"id": 61, "genre": "বিচ্ছেদী গান", "title": "কোকিলের ডাকে বিরহ", "stanzas": ["কোকিল ডাকে আম্র শাখে,\nবসন্তকালের করুণ সুরে,\nআমার মনে জাগায় স্মৃতি,\nবন্ধু যে গেছে বহুদূরে।", "সেই সুরে আজ কাঁদে হৃদয়,\nবিরহেরই মালা গাঁথি,\nকোকিল তুমি থামো এবার,\nবুক ভাঙে যে তোমার ডাকাডাকি।"]}, {"id": 62, "genre": "পল্লীগীতি", "title": "গাঁয়ের বধূ", "stanzas": ["গাঁয়ের বধূ ঘাটে যায়,\nকলসি কাঁখে নদীর টানে,\nমাথায় ঘোমটা, চোখে লজ্জা,\nহাসি লুকায় আঁচল খানে।", "পথের ধারে বকুল গাছে,\nফুল ঝরে তার পায়ের কাছে,\nগাঁয়ের এই সহজ ছবি,\nহৃদয় জুড়ে বাস করে আছে।"]}, {"id": 63, "genre": "পল্লীগীতি", "title": "বাঁশবাগানের মায়া", "stanzas": ["বাঁশবাগানের ছায়ায় বসে,\nবাঁশি বাজায় রাখাল ছেলে,\nদুপুর রোদে ঘুমিয়ে পড়ে,\nগ্রাম বাংলা স্বপ্ন মেলে।", "পুকুর পাড়ে হাঁসের সারি,\nভেসে বেড়ায় জলের বুকে,\nএমনই এক শান্ত ছবি,\nআঁকা থাকে মনের কোণে।"]}, {"id": 64, "genre": "পল্লীগীতি", "title": "পুকুর ঘাটের গল্প", "stanzas": ["পুকুর ঘাটে জল ভরতে,\nমেয়েরা সব করে হাসাহাসি,\nদুপুর বেলার রোদ মাখা এই,\nগল্পগুলো মন ভালোবাসি।", "সাঁঝের বেলা প্রদীপ জ্বলে,\nঘাটের ধারে তুলসী তলায়,\nগ্রাম বাংলার এই তো ছন্দ,\nমনটা যেন সেথায় ছোটে।"]}, {"id": 65, "genre": "পল্লীগীতি", "title": "মেঠো পথের গান", "stanzas": ["মেঠো পথে হাঁটি একা,\nদুই ধারে সবুজ ধানের ক্ষেত,\nপাখির ডাকে ভোর হলো যেন,\nআকাশ জুড়ে আলোর ব্রত।", "এই পথ ধরে কতবার,\nগিয়েছি আমি ফিরেছি ঘরে,\nমেঠো পথের ধুলোর সাথে,\nমিশে আছে আমার পরে।"]}, {"id": 66, "genre": "পল্লীগীতি", "title": "গোধূলির রঙ", "stanzas": ["গোধূলির রঙ মাঠের বুকে,\nছড়িয়ে পড়ে সোনার আভা,\nগরুর পাল ফিরছে ঘরে,\nরাখাল বাজায় বাঁশির সভা।", "সন্ধ্যা তারা জাগে আকাশে,\nঘরে ঘরে প্রদীপ জ্বলে,\nএই তো আমার গ্রাম বাংলা,\nহৃদয় জুড়ে রয় সে সকলে।"]}, {"id": 67, "genre": "পল্লীগীতি", "title": "কুঁড়েঘরের সুখ", "stanzas": ["কুঁড়েঘরে নাই যে বিলাস,\nআছে শুধু ভালোবাসা,\nমাটির দাওয়ায় বসে থাকি,\nমনে জাগে সহজ আশা।", "গরিব হলেও মন যে বড়,\nএই তো আমার গাঁয়ের রীতি,\nদুঃখ সুখে একসাথে থাকা,\nএই তো আমাদের প্রথা নীতি।"]}, {"id": 68, "genre": "ঘাটু গান", "title": "ঘাটুর নাচের গান", "stanzas": ["ঘাটু নাচে রঙ্গ করে,\nঢোলের বাদ্যি বাজে সুরে,\nগাঁয়ের মেলায় ভিড় জমেছে,\nহাসির রোল ওঠে দূরে।", "রঙিন সাজে ঘাটু ছেলে,\nনাচের তাল <script>
(function(){
  const allSongs = JSON.parse(document.getElementById('songData').textContent);
  const genres = ['সব', ...Array.from(new Set(allSongs.map(s=>s.genre)))];

  let activeGenre = 'সব';
  let searchTerm = '';
  let current = 0;
  let filtered = allSongs.slice();

  const track = document.getElementById('track');
  const dotsWrap = document.getElementById('dots');
  const counterEl = document.getElementById('counter');
  const chipsWrap = document.getElementById('chips');

  function renderChips(){
    chipsWrap.innerHTML = genres.map(g =>
      `<div class="chip ${g===activeGenre?'active':''}" data-genre="${g}">${g}</div>`
    ).join('');
    chipsWrap.querySelectorAll('.chip').forEach(el=>{
      el.addEventListener('click', ()=>{
        activeGenre = el.dataset.genre;
        applyFilter(true);
        renderChips();
      });
    });
  }

  function applyFilter(reset){
    filtered = allSongs.filter(s=>{
      const genreOk = activeGenre==='সব' || s.genre===activeGenre;
      const term = searchTerm.trim();
      const searchOk = !term || s.title.includes(term) || s.genre.includes(term);
      return genreOk && searchOk;
    });
    if(reset) current = 0;
    if(current >= filtered.length) current = Math.max(0, filtered.length-1);
    renderCards();
    renderDots();
    updatePosition();
  }

  function stanzaHtml(s){
    return s.stanzas.map(st => `<p class="stanza">${escapeHtml(st).replace(/\n/g,'<br>')}</p>`).join('');
  }
  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderCards(){
    if(filtered.length===0){
      track.innerHTML = `<div class="card-slot"><div class="card"><div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="1.6"/></svg>
        <div>কোনো গান পাওয়া যায়নি। অন্য কিছু খুঁজে দেখুন।</div>
      </div></div></div>`;
      counterEl.textContent = '0 / 0';
      return;
    }
    track.innerHTML = filtered.map((song, i) => `
      <div class="card-slot">
        <div class="card">
          <div class="kantha-border"></div>
          <div class="copy-btn" data-copy-idx="${i}" title="গান কপি করুন">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="2"/></svg>
          </div>
          <div class="card-top">
            <div class="genre-tag">${song.genre}</div>
            <h2 class="card-title display">${escapeHtml(song.title)}</h2>
            <div class="card-index">গান ${i+1} · মৌলিক রচনা</div>
          </div>
          <div class="lyrics-scroll">${stanzaHtml(song)}</div>
        </div>
      </div>
    `).join('');
    attachCopyHandlers();
  }

  function songToPlainText(song){
    const body = song.stanzas.join('\n\n');
    return `${song.title}\n(${song.genre})\n\n${body}\n\n— লোকসুর অ্যাপ থেকে`;
  }

  let toastTimer = null;
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1600);
  }

  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copySong(song, btn){
    const text = songToPlainText(song);
    const done = ()=>{
      btn.classList.add('copied');
      showToast('গানটি কপি হয়েছে ✓');
      setTimeout(()=> btn.classList.remove('copied'), 1200);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>{
        if(fallbackCopy(text)) done();
        else showToast('কপি করা যায়নি');
      });
    } else {
      if(fallbackCopy(text)) done();
      else showToast('কপি করা যায়নি');
    }
  }

  function attachCopyHandlers(){
    track.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const idx = parseInt(btn.dataset.copyIdx);
        const song = filtered[idx];
        if(song) copySong(song, btn);
      });
    });
  }

  function renderDots(){
    const max = 12;
    if(filtered.length <= max){
      dotsWrap.innerHTML = filtered.map((_,i)=>`<div class="dot" data-i="${i}"></div>`).join('');
    } else {
      dotsWrap.innerHTML = Array.from({length:max}).map((_,i)=>`<div class="dot" data-i="${Math.round(i*(filtered.length-1)/(max-1))}"></div>`).join('');
    }
  }

  function updatePosition(){
    track.style.transform = `translateX(-${current*100}%)`;
    counterEl.textContent = filtered.length ? `${current+1} / ${filtered.length}` : '0 / 0';
    const dots = dotsWrap.querySelectorAll('.dot');
    dots.forEach(d=>d.classList.remove('active'));
    let closest = null, closestDist = Infinity;
    dots.forEach(d=>{
      const dist = Math.abs(parseInt(d.dataset.i) - current);
      if(dist < closestDist){ closestDist = dist; closest = d; }
    });
    if(closest) closest.classList.add('active');
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(current>0){ current--; updatePosition(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(current<filtered.length-1){ current++; updatePosition(); }
  });

  document.getElementById('searchToggle').addEventListener('click', ()=>{
    document.getElementById('searchWrap').classList.toggle('open');
    document.getElementById('searchInput').focus();
  });
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    applyFilter(true);
  });

  // Swipe handling
  let startX = 0, startY = 0, dragging = false, deltaX = 0;
  const stage = document.querySelector('.stage');
  stage.addEventListener('touchstart', (e)=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging = true;
    deltaX = 0;
    track.style.transition = 'none';
  }, {passive:true});
  stage.addEventListener('touchmove', (e)=>{
    if(!dragging) return;
    deltaX = e.touches[0].clientX - startX;
    const deltaY = e.touches[0].clientY - startY;
    if(Math.abs(deltaX) > Math.abs(deltaY)){
      const pct = (deltaX / stage.clientWidth) * 100;
      track.style.transform = `translateX(calc(-${current*100}% + ${pct}%))`;
    }
  }, {passive:true});
  stage.addEventListener('touchend', ()=>{
    dragging = false;
    track.style.transition = '';
    const threshold = stage.clientWidth * 0.18;
    if(deltaX > threshold && current>0) current--;
    else if(deltaX < -threshold && current<filtered.length-1) current++;
    updatePosition();
  });

  // Keyboard support (desktop)
  document.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowLeft' && current>0){ current--; updatePosition(); }
    if(e.key==='ArrowRight' && current<filtered.length-1){ current++; updatePosition(); }
  });

  renderChips();
  applyFilter(true);
})();
</script>
</body>
</html>
